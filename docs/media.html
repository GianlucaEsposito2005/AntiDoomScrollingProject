<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Statement</a>
            <a href="media.html" class="active">Media</a>
            <a href="learned.html">Learned</a>
        </nav>
    </header>

    <main>
        <h1>Media</h1>

        <!-- Archive selectors -->
        <div class="archive-selector">

            <div>
                <label for="year">Year</label>
                <select id="year" name="year">
                    <option value="2026">2026</option>
                </select>
            </div>

            <div>
                <label for="month">Month</label>
                <select id="month" name="month">
                    <option value="october">October</option>
                </select>
            </div>

        </div>


        <!-- October 16 -->
        <section class="day-entry">

            <h2>Friday, October 16, 2026</h2>

            <div class="media-entry">

                <h3>Media Consumed</h3>

                <div class="media-content">

                    <!-- Image -->
                    <div class="media-image">
                        <img 
                            src="images/example.jpg" 
                            alt="Media cover"
                        >
                    </div>

                    <!-- Description -->
                    <div class="media-description">

                        <h4>Title of Media</h4>

                        <p>
                            Write about what you watched, read, listened to,
                            played, or otherwise consumed here.
                        </p>

                        <div class="tags">
                            <span class="tag">Movie</span>
                            <span class="tag">Comedy</span>
                            <span class="tag">2020s</span>
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- October 15 -->
        <section class="day-entry">

            <h2>Thursday, October 15, 2026</h2>

            <div class="media-entry">

                <h3>Media Consumed</h3>

                <div class="media-content">

                    <div class="media-image">
                        <img 
                            src="images/example.jpg" 
                            alt="Media cover"
                        >
                    </div>

                    <div class="media-description">

                        <h4>Title of Media</h4>

                        <p>
                            Write your description here.
                        </p>

                        <div class="tags">
                            <span class="tag">Book</span>
                            <span class="tag">Fiction</span>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
